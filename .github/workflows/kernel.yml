name: Update ExtremeKernel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: c1s
            model: c1s
          - target: c2s
            model: c2s
          - target: x1s
            model: x1s
          - target: y2slte
            model: y2slte
          - target: z3s
            model: z3s

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            python-is-python3 python3 wget curl

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustc --version
          cargo --version

          sudo modprobe erofs f2fs

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build ExtremeKernel
        run: |
          KERNEL_REPO="https://github.com/At30c/SSM_990v2BYEXTREME/"
          KERNEL_TMP_DIR="$HOME/kernel_build"

          git clone "$KERNEL_REPO" --single-branch "$KERNEL_TMP_DIR"
          cd "$KERNEL_TMP_DIR"
          git submodule sync --recursive
          git submodule update --init --recursive

          KERNEL_COMMIT=$(git rev-parse --short=12 HEAD)
          echo "KERNEL_COMMIT=$KERNEL_COMMIT" >> "$GITHUB_ENV"

          echo "=== Building kernel for ${{ matrix.target }} (model=${{ matrix.model }}) ==="

          has_lte() {
            case "$1" in
              c1s|c2s|x1s|y2slte) return 0 ;;
              *) return 1 ;;
            esac
          }

          get_lte_model() {
            case "$1" in
              y2slte) echo "y2slte" ;;
              *) echo "${1}lte" ;;
            esac
          }

          get_5g_model() {
            case "$1" in
              y2slte) echo "y2s" ;;
              *) echo "$1" ;;
            esac
          }

          MODEL_5G=$(get_5g_model "${{ matrix.model }}")

          if has_lte "${{ matrix.target }}"; then
            LTE_MODEL=$(get_lte_model "${{ matrix.target }}")

            echo "=== Building 5G model: $MODEL_5G ==="
            ./build.sh -m "$MODEL_5G" -k y -r n

            echo "=== Building LTE model: $LTE_MODEL ==="
            ./build.sh -m "$LTE_MODEL" -k n -r n -d y
          else
            echo "=== Building model: ${{ matrix.model }} ==="
            ./build.sh -m "${{ matrix.model }}" -k y -r n
          fi

          KERNEL_ZIP="$GITHUB_WORKSPACE/target/${{ matrix.target }}/patches/kernel/kernel.zip"
          ZIP_DIR="$HOME/kernel_zip"
          mkdir -p "$ZIP_DIR"

          if has_lte "${{ matrix.target }}"; then
            cp "$KERNEL_TMP_DIR/build/out/$MODEL_5G/boot.img" "$ZIP_DIR/"
            cp "$KERNEL_TMP_DIR/build/out/$MODEL_5G/dtbo.img" "$ZIP_DIR/"
            cp "$KERNEL_TMP_DIR/build/out/$LTE_MODEL/dtbo.img" "$ZIP_DIR/dtbo_lte.img"
          else
            cp "$KERNEL_TMP_DIR/build/out/${{ matrix.model }}/boot.img" "$ZIP_DIR/"
            cp "$KERNEL_TMP_DIR/build/out/${{ matrix.model }}/dtbo.img" "$ZIP_DIR/"
          fi

          cd "$ZIP_DIR"
          rm -f "$KERNEL_ZIP"
          zip -r -qq "$KERNEL_ZIP" .
          echo "Updated $KERNEL_ZIP ($(stat -c%s "$KERNEL_ZIP") bytes)"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            target/${{ matrix.target }}/patches/kernel/
          commit-message: 'target/${{ matrix.target }}: update ExtremeKernel to ${{ env.KERNEL_COMMIT }}'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          branch: 'kernel/${{ matrix.target }}/update'
          delete-branch: true
          title: 'Update ${{ matrix.target }} ExtremeKernel to ${{ env.KERNEL_COMMIT }}'
          body: |
            Auto-updated ExtremeKernel prebuilt zip for `${{ matrix.target }}`.

            Kernel commit: `${{ env.KERNEL_COMMIT }}`
            Repo: https://github.com/At30c/SSM_990v2BYEXTREME/
